<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-label="Minh hoạ gia đình được bảo vệ">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF3F6"/><stop offset="1" stop-color="#F8DBE4"/></linearGradient>
<linearGradient id="um" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#E8447A"/><stop offset="1" stop-color="#B70E3B"/></linearGradient>
<filter id="sh" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#7C0827" flood-opacity="0.14"/></filter>
<filter id="sh2" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7C0827" flood-opacity="0.10"/></filter>
</defs>

<rect width="800" height="620" rx="28" fill="url(#bg)"/>
<circle cx="672" cy="108" r="152" fill="#D31145" opacity=".07"/>
<circle cx="104" cy="536" r="176" fill="#D31145" opacity=".05"/>
<circle cx="712" cy="486" r="9" fill="#D31145" opacity=".28"/>
<circle cx="82" cy="158" r="6" fill="#D31145" opacity=".32"/>
<circle cx="748" cy="292" r="5" fill="#D31145" opacity=".22"/>
<circle cx="168" cy="88" r="4" fill="#D31145" opacity=".3"/>

<!-- pole (behind everything) -->
<rect x="395" y="150" width="10" height="418" rx="5" fill="#8A2436"/>

<!-- umbrella -->
<g filter="url(#sh)">
  <path d="M400 128 C288 128 200 204 194 296 L606 296 C600 204 512 128 400 128 Z" fill="url(#um)"/>
  <path d="M194 296 C236 296 250 274 266 274 C282 274 296 296 337 296 C378 296 368 274 400 274 C432 274 422 296 463 296 C504 296 518 274 534 274 C550 274 564 296 606 296 Z" fill="#9E0B33"/>
</g>
<circle cx="400" cy="120" r="11" fill="#8A2436"/>

<!-- ground shadow -->
<ellipse cx="410" cy="572" rx="252" ry="16" fill="#B70E3B" opacity=".08"/>

<!-- father -->
<circle cx="300" cy="404" r="31" fill="#F0A08F"/>
<path d="M300 373 q-33 5 -34 26 q22 -9 34 -9 q12 0 34 9 q-1 -21 -34 -26 Z" fill="#2B2220"/>
<path d="M253 568 L253 476 a47 47 0 0 1 94 0 L347 568 Z" fill="#2F3B52"/>
<path d="M300 429 l-14 12 l14 34 l14 -34 Z" fill="#fff" opacity=".9"/>

<!-- mother -->
<circle cx="456" cy="392" r="34" fill="#F7BBA9"/>
<path d="M456 358 q-37 5 -38 30 q-2 26 8 34 q-2 -30 30 -34 q32 4 30 34 q10 -8 8 -34 q-1 -25 -38 -30 Z" fill="#3A2C2A"/>
<path d="M404 566 L404 472 a52 52 0 0 1 104 0 L508 566 Z" fill="#D31145"/>
<!-- baby bundle -->
<g filter="url(#sh2)">
  <ellipse cx="424" cy="498" rx="42" ry="27" fill="#FFF1E8" transform="rotate(-12 424 498)"/>
  <circle cx="393" cy="490" r="17" fill="#FFCDB4"/>
  <path d="M385 486 q3 4 7 0 M397 486 q3 4 7 0" stroke="#C98873" stroke-width="2.4" fill="none" stroke-linecap="round"/>
</g>
<path d="M456 462 q-38 12 -44 32" stroke="#F7BBA9" stroke-width="17" fill="none" stroke-linecap="round"/>

<!-- child -->
<circle cx="556" cy="450" r="25" fill="#F9C9AE"/>
<path d="M556 425 q-27 4 -28 20 q18 -7 28 -7 q10 0 28 7 q-1 -16 -28 -20 Z" fill="#4A2F1E"/>
<path d="M520 568 L520 506 a36 36 0 0 1 72 0 L592 568 Z" fill="#E8447A"/>

<!-- floating card left -->
<g filter="url(#sh)" transform="translate(56,226)">
<rect width="200" height="84" rx="16" fill="#fff"/>
<circle cx="42" cy="42" r="21" fill="#FDEEF2"/>
<path d="M34 42 l6 7 l12 -15" stroke="#D31145" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="76" y="27" width="104" height="10" rx="5" fill="#E9ECF0"/>
<rect x="76" y="47" width="66" height="10" rx="5" fill="#F3F5F7"/>
</g>

<!-- floating card right -->
<g filter="url(#sh)" transform="translate(566,164)">
<rect width="188" height="98" rx="16" fill="#fff"/>
<rect x="18" y="20" width="74" height="9" rx="4.5" fill="#E9ECF0"/>
<text x="18" y="63" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#D31145">270</text>
<text x="74" y="63" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#8E959F">ngày chờ</text>
<rect x="18" y="76" width="152" height="6" rx="3" fill="#F1F3F5"/>
<rect x="18" y="76" width="98" height="6" rx="3" fill="#D31145"/>
</g>
</svg>
